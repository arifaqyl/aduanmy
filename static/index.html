<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TrafficMY · Malaysia transit signals</title>
<meta name="description" content="What riders report on Malaysian LRT, MRT, KTM and monorail today. Evidence and confidence, not a fake all-clear.">
<meta name="theme-color" content="#0a0a0b">
<meta name="color-scheme" content="dark">

<meta property="og:title" content="TrafficMY · Malaysia transit signals">
<meta property="og:description" content="Rider-reported delays with visible evidence strength. A quiet line is not an all-clear.">
<meta property="og:type" content="website">
<meta property="og:image" content="static/og-image.png">
<meta property="og:image:alt" content="TrafficMY">

<link rel="icon" href="static/brand/trafficmy-mark.png" type="image/png">
<link rel="apple-touch-icon" href="static/brand/trafficmy-mark.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="static/css/tm.css?v=59">
</head>
<body>

<div class="app">

  <header class="hdr">
    <h1 class="hdr-mark">TrafficMY</h1>
    <time class="hdr-clock" id="clock" aria-label="Current Malaysia time">--:--</time>
    <span class="dot" id="dot" data-s="load" role="status" aria-label="Feed status"></span>
    <button class="hbtn" id="lang" type="button" aria-label="Switch language">EN</button>
    <button class="hbtn" id="refresh" type="button" aria-label="Refresh">
      <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
        <path d="M17 10a7 7 0 1 1-2.05-4.95"/><path d="M17 3v4h-4"/>
      </svg>
    </button>
  </header>

  <div class="glance" id="glance" role="status" aria-live="polite">
    <span class="glance-txt" id="glanceTxt">Checking sources</span>
    <span class="glance-meta" id="glanceMeta"></span>
  </div>

  <!-- BOARD ------------------------------------------------------------- -->
  <section class="panel on" id="pBoard" role="tabpanel" aria-labelledby="tBoard">
    <div class="filter" role="group" aria-label="Filter lines">
      <button class="chip" type="button" data-f="all"      aria-pressed="true">All</button>
      <button class="chip" type="button" data-f="signals"  aria-pressed="false">With signals</button>
      <button class="chip" type="button" data-f="lrt"      aria-pressed="false">LRT</button>
      <button class="chip" type="button" data-f="mrt"      aria-pressed="false">MRT</button>
      <button class="chip" type="button" data-f="ktm"      aria-pressed="false">KTM</button>
      <button class="chip" type="button" data-f="monorail" aria-pressed="false">Monorail</button>
      <button class="chip" type="button" data-f="bus"      aria-pressed="false">Bus</button>
    </div>

    <div class="scroll">
      <p class="banner" id="staleBanner" hidden></p>
      <div id="board">
        <div class="load">
          <div class="spin" aria-hidden="true"></div>
          <span class="load-l">Reading the board</span>
        </div>
      </div>
    </div>
  </section>

  <!-- MAP --------------------------------------------------------------- -->
  <section class="panel" id="pMap" role="tabpanel" aria-labelledby="tMap">
    <div class="map-wrap">
      <div id="map"></div>
      <p class="map-note" id="mapNote">Loading incident markers</p>
    </div>
  </section>

  <!-- PLAN -------------------------------------------------------------- -->
  <section class="panel" id="pPlan" role="tabpanel" aria-labelledby="tPlan">
    <div class="scroll prose" id="planBody"></div>
  </section>

  <!-- ABOUT ------------------------------------------------------------- -->
  <section class="panel" id="pAbout" role="tabpanel" aria-labelledby="tAbout">
    <div class="scroll prose" id="aboutBody"></div>
  </section>

  <nav class="nav" role="tablist" aria-label="Sections">
    <button class="nav-b" id="tBoard" role="tab" data-p="pBoard" aria-selected="true" aria-controls="pBoard">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path d="M3 5h14M3 10h14M3 15h14"/>
      </svg>
      Board
    </button>
    <button class="nav-b" id="tMap" role="tab" data-p="pMap" aria-selected="false" aria-controls="pMap">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path d="M10 17s6-5.2 6-9.4A6 6 0 0 0 4 7.6C4 11.8 10 17 10 17Z"/><circle cx="10" cy="7.6" r="2"/>
      </svg>
      Map
    </button>
    <button class="nav-b" id="tPlan" role="tab" data-p="pPlan" aria-selected="false" aria-controls="pPlan">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <path d="M3 15c0-3 3-3 3-6S3 5 3 5"/><path d="M11 5h6m0 0-2-2m2 2-2 2"/><path d="M11 15h6m0 0-2-2m2 2-2 2"/>
      </svg>
      Plan
    </button>
    <button class="nav-b" id="tAbout" role="tab" data-p="pAbout" aria-selected="false" aria-controls="pAbout">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <circle cx="10" cy="10" r="7"/><path d="M10 14v-4"/><path d="M10 6.6h.01"/>
      </svg>
      About
    </button>
  </nav>

</div>

<!-- Line detail sheet ---------------------------------------------------- -->
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT" hidden>
  <div class="sheet-grip" aria-hidden="true"></div>
  <div class="sheet-hd">
    <span class="sheet-rail" id="sheetRail" aria-hidden="true"></span>
    <h2 class="sheet-t" id="sheetT">Line</h2>
    <button class="sheet-x" id="sheetX" type="button" aria-label="Close">
      <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <path d="M5 5l10 10M15 5L5 15"/>
      </svg>
    </button>
  </div>
  <div class="sheet-bd" id="sheetBd"></div>
</div>

<noscript>
  <div class="nojs">
    <p><strong>TrafficMY needs JavaScript.</strong></p>
    <p>The board reads live rider signals and cannot be rendered statically.</p>
  </div>
</noscript>

<script src="static/js/board.js?v=59"></script>
</body>
</html>
