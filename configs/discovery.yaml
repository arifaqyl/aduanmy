rss_feeds:
  # Recency is enforced with Google News' `when:` operator. Without it the
  # search defaults to relevance and returns years-old articles (measured:
  # median 190 days, max 1497 days) into a feed that claims to show today.
  # Disruption verbs keep this to live incidents, not retrospective features.
  - url: "https://news.google.com/rss/search?q=%28LRT%20OR%20MRT%20OR%20monorail%20OR%20%22Rapid%20KL%22%20OR%20%22Kelana%20Jaya%22%20OR%20Ampang%20OR%20Kajang%20OR%20Putrajaya%29%20%28disruption%20OR%20delay%20OR%20delays%20OR%20breakdown%20OR%20fault%20OR%20suspended%20OR%20evacuated%20OR%20stalled%29%20Malaysia%20when%3A2d&hl=en-MY&gl=MY&ceid=MY:en"
    category: transport
    author_handle: google-news:kv-en
  - url: "https://news.google.com/rss/search?q=%28LRT%20OR%20MRT%20OR%20monorel%20OR%20tren%20OR%20%22Kelana%20Jaya%22%29%20%28gangguan%20OR%20kelewatan%20OR%20rosak%20OR%20tergendala%20OR%20terhenti%20OR%20lewat%29%20%28Malaysia%20OR%20%22Kuala%20Lumpur%22%20OR%20Selangor%20OR%20RapidKL%20OR%20KTMB%20OR%20Prasarana%29%20when%3A2d&hl=ms-MY&gl=MY&ceid=MY:ms"
